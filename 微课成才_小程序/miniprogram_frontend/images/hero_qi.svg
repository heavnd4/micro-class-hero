<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆环 -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1e3c72" stroke-width="2" stroke-dasharray="10 5" />
  
  <!-- 英雄主体 (抽象几何风) -->
  <path d="M100 40 L140 140 L100 120 L60 140 Z" fill="#2a5298" stroke="#00f2fe" stroke-width="3"/>
  
  <!-- 核心能量球 -->
  <circle cx="100" cy="90" r="15" fill="#00f2fe">
    <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- 音律声波 -->
  <rect x="70" y="150" width="5" height="20" fill="#00f2fe">
    <animate attributeName="height" values="10;30;10" dur="0.8s" repeatCount="indefinite" />
  </rect>
  <rect x="85" y="150" width="5" height="30" fill="#00f2fe">
    <animate attributeName="height" values="20;40;20" dur="1s" repeatCount="indefinite" />
  </rect>
  <rect x="100" y="150" width="5" height="15" fill="#00f2fe">
    <animate attributeName="height" values="5;25;5" dur="1.2s" repeatCount="indefinite" />
  </rect>
  <rect x="115" y="150" width="5" height="25" fill="#00f2fe">
    <animate attributeName="height" values="15;35;15" dur="0.9s" repeatCount="indefinite" />
  </rect>
  <rect x="130" y="150" width="5" height="20" fill="#00f2fe">
    <animate attributeName="height" values="10;30;10" dur="1.1s" repeatCount="indefinite" />
  </rect>
</svg>